<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#252526">
  <title>Offline HTML Builder</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #1e1e1e; color: #fff; }
    header { background: #252526; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3c3c3c; flex-wrap: wrap; gap: 8px; }
    .file-info { display: flex; align-items: center; gap: 8px; }
    h1 { font-size: 15px; font-weight: 600; color: #cccccc; }
    #fileNameDisplay { font-size: 13px; color: #4ec9b0; font-family: monospace; background: #1e1e1e; padding: 3px 8px; border-radius: 4px; border: 1px solid #3c3c3c; }
    .btn-group { display: flex; gap: 8px; }
    button { background: #0e639c; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1177bb; }
    button.secondary { background: #3c3c3c; }
    button.secondary:hover { background: #505050; }
    .container { display: flex; flex: 1; overflow: hidden; }
    .editor-container, .preview-container { width: 50%; height: 100%; display: flex; flex-direction: column; }
    .editor-container { border-right: 1px solid #3c3c3c; }
    .panel-header { background: #2d2d2d; padding: 6px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #9cdcfe; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; }
    .stats { color: #858585; font-size: 11px; }

    /* Area Editor Native */
    .editor-wrapper { flex: 1; display: flex; position: relative; background: #1e1e1e; overflow: hidden; }
    .line-numbers { width: 52px; background: #1e1e1e; color: #858585; padding: 12px 6px; font-family: "Consolas", "Courier New", monospace; font-size: 13px; line-height: 1.5; text-align: right; user-select: none; border-right: 1px solid #2d2d2d; overflow: hidden; white-space: pre; }
    
    textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; border: none; padding: 12px; font-family: "Consolas", "Courier New", monospace; font-size: 13px; line-height: 1.5; resize: none; outline: none; tab-size: 2; overflow-y: scroll; white-space: pre; }
    
    iframe { flex: 1; background: #ffffff; border: none; width: 100%; height: 100%; }

    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .editor-container, .preview-container { width: 100%; height: 50%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="file-info">
      <h1>HTML Builder</h1>
      <span id="fileNameDisplay">untitled.html</span>
    </div>
    <div class="btn-group">
      <button class="secondary" onclick="newFile()">+ File Baru</button>
      <button class="secondary" onclick="loadFromFile()">Buka File</button>
      <button onclick="downloadHTML()">Simpan File</button>
      <input type="file" id="fileInput" accept=".html,.txt" style="display: none;" onchange="readSingleFile(event)">
    </div>
  </header>

  <div class="container">
    <div class="editor-container">
      <div class="panel-header">
        <span>Editor Kode</span>
        <span class="stats" id="statsDisplay">0 Baris | 0 Spasi</span>
      </div>
      <div class="editor-wrapper">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="code" spellcheck="false" placeholder="Tulis atau tempel kode HTML di sini..."></textarea>
      </div>
    </div>
    <div class="preview-container">
      <div class="panel-header">Live Preview</div>
      <iframe id="preview"></iframe>
    </div>
  </div>

  <script>
    const codeArea = document.getElementById('code');
    const lineNumbers = document.getElementById('lineNumbers');
    const preview = document.getElementById('preview');
    const statsDisplay = document.getElementById('statsDisplay');
    const fileNameDisplay = document.getElementById('fileNameDisplay');

    let currentFileName = localStorage.getItem('pwa_html_filename') || 'index.html';
    fileNameDisplay.textContent = currentFileName;

    // Default Template HTML
    const defaultCode = `<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
    h1 { color: #0e639c; }
  </style>
</head>
<body>
  <h1>Halo World!</h1>
  <p>Silakan mulai mengetik atau menempelkan kode HTML di sisi kiri.</p>
</body>
</html>`;

    // Load dari LocalStorage
    const savedCode = localStorage.getItem('pwa_html_editor_code');
    codeArea.value = savedCode !== null ? savedCode : defaultCode;

    // Sinkronisasi Scroll antara Textarea dan Line Numbers
    codeArea.addEventListener('scroll', () => {
      lineNumbers.scrollTop = codeArea.scrollTop;
    });

    // Update Live Preview, Nomor Baris, dan Statistik
    let timeout;
    function updatePreviewAndEditor() {
      const code = codeArea.value;
      
      // Update Live Preview
      const previewDoc = preview.contentDocument || preview.contentWindow.document;
      previewDoc.open();
      previewDoc.write(code);
      previewDoc.close();

      // Hitung Nomor Baris
      const lines = code.split('\n');
      const lineCount = lines.length;
      let lineNumsHtml = '';
      for (let i = 1; i <= lineCount; i++) {
        lineNumsHtml += i + '\n';
      }
      lineNumbers.textContent = lineNumsHtml;

      // Hitung Jumlah Spasi dan Karakter
      const spaceCount = (code.match(/ /g) || []).length;
      const totalChars = code.length;
      statsDisplay.textContent = `${lineCount.toLocaleString('id-ID')} Baris | ${spaceCount.toLocaleString('id-ID')} Spasi | ${totalChars.toLocaleString('id-ID')} Karakter`;

      // Auto-save ke LocalStorage
      localStorage.setItem('pwa_html_editor_code', code);
      localStorage.setItem('pwa_html_filename', currentFileName);
    }

    // Debounce update saat mengetik agar ringan
    codeArea.addEventListener('input', () => {
      clearTimeout(timeout);
      timeout = setTimeout(updatePreviewAndEditor, 150);
    });

    // Fitur Tab Indentasi
    codeArea.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = codeArea.selectionStart;
        const end = codeArea.selectionEnd;
        codeArea.value = codeArea.value.substring(0, start) + '  ' + codeArea.value.substring(end);
        codeArea.selectionStart = codeArea.selectionEnd = start + 2;
        updatePreviewAndEditor();
      }
    });

    // Fitur Tambah File Baru (Pop-Up Nama File)
    function newFile() {
      const inputName = prompt('Masukkan nama file baru:', 'untitled.html');
      if (inputName !== null && inputName.trim() !== '') {
        let name = inputName.trim();
        if (!name.endsWith('.html') && !name.endsWith('.htm')) {
          name += '.html';
        }
        currentFileName = name;
        fileNameDisplay.textContent = currentFileName;
        codeArea.value = defaultCode;
        updatePreviewAndEditor();
      }
    }

    // Simpan File (Otomatis Menggunakan Nama File)
    function downloadHTML() {
      const blob = new Blob([codeArea.value], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = currentFileName;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // Buka File Lokal
    function loadFromFile() {
      document.getElementById('fileInput').click();
    }

    function readSingleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      currentFileName = file.name;
      fileNameDisplay.textContent = currentFileName;

      const reader = new FileReader();
      reader.onload = function(e) {
        codeArea.value = e.target.result;
        updatePreviewAndEditor();
      };
      reader.readAsText(file);
    }

    // Render Awal
    updatePreviewAndEditor();

    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered!', reg))
          .catch(err => console.error('SW Registration Failed!', err));
      });
    }
  </script>
</body>
</html>
